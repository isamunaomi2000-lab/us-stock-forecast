name: Stock Trading Simulation V6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check input files
        run: |
          ls -lh scripts/simulate_trading_v6.py
          ls -lh data/stocks/

      - name: Run V6 simulation
        run: |
          python scripts/simulate_trading_v6.py

      - name: Display V6 results
        run: |
          python -m json.tool data/trading_simulation_v6/summary.json

      - name: Commit V6 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trading_simulation_v6/
          if ! git diff --cached --quiet; then
            git commit -m "Update V6 trading simulation"
            git push
          else
            echo "No changes to commit"
          fi
