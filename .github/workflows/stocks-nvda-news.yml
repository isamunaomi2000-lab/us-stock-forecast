name: NVDA Official News Collection

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: write

concurrency:
  group: nvda-news-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch NVIDIA official news
        run: python scripts/fetch_nvda_news.py

      - name: Display latest news
        run: |
          python - <<'PY'
          import csv
          with open(
              "data/news/nvda_events.csv",
              encoding="utf-8-sig",
              newline=""
          ) as f:
              rows = list(csv.DictReader(f))
          print("Total news:", len(rows))
          for row in rows[-10:]:
              print(
                  row["published_at_utc"],
                  row["headline"],
                  row["url"]
              )
          PY

      - name: Commit news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news/nvda_events.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update NVIDIA official news"
            git push
          else
            echo "No new news to commit"
          fi
