name: US Stocks Historical Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run historical backtest
        run: python scripts/backtest_stocks.py

      - name: Save backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/
          if ! git diff --cached --quiet; then
            git commit -m "Update historical stock backtest"
            git push
          fi
