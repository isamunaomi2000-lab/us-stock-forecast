name: Stock Trading Model Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required files
        run: |
          ls -lh scripts/validate_trading_models.py
          ls -lh data/model_comparison_v3/results.csv
          ls -lh data/stocks/

      - name: Run model validation
        run: |
          python scripts/validate_trading_models.py

      - name: Display validation results
        run: |
          python -m json.tool data/trading_validation/summary.json

      - name: Commit validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trading_validation/
          if ! git diff --cached --quiet; then
            git commit -m "Update stock trading model validation"
            git push
          else
            echo "No changes to commit"
          fi
