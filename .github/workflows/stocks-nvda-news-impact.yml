name: NVDA News Impact Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Analyze NVIDIA news impact
        run: python scripts/analyze_nvda_news_impact.py

      - name: Display results
        run: python -m json.tool data/nvda_news_impact/summary.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvda_news_impact/
          if ! git diff --cached --quiet; then
            git commit -m "Update NVDA news impact analysis"
            git push
          else
            echo "No changes to commit"
          fi
