name: Stock Trading Validation V1-V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run comparison
        run: python scripts/validate_trading_v5.py

      - name: Show results
        run: python -m json.tool data/trading_validation_v5/summary.json

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trading_validation_v5/
          if ! git diff --cached --quiet; then
            git commit -m "Update V1-V5 comparison"
            git push
          fi
