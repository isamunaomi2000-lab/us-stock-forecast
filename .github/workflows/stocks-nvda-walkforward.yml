name: NVDA Walk Forward Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run NVDA walk-forward validation
        run: python scripts/validate_nvda_walkforward.py

      - name: Display results
        run: python -m json.tool data/nvda_walkforward/summary.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvda_walkforward/
          if ! git diff --cached --quiet; then
            git commit -m "Update NVDA walk-forward validation"
            git push
          else
            echo "No changes to commit"
          fi
