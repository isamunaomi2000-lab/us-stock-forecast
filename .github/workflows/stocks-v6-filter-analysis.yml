name: V6 Filter Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V6 filter analysis
        run: python scripts/analyze_v6_filters.py

      - name: Display analysis results
        run: |
          python -m json.tool data/v6_filter_analysis/summary.json

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v6_filter_analysis/
          if ! git diff --cached --quiet; then
            git commit -m "Update V6 filter analysis"
            git push
          else
            echo "No changes to commit"
          fi
