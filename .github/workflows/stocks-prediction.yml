name: Daily US Stock Prediction

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 1-5'

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate stock forecasts
        run: python scripts/predict_stocks.py

      - name: Commit prediction data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions/
          if ! git diff --cached --quiet; then
            git commit -m "Update daily US stock predictions"
            git push
          fi
