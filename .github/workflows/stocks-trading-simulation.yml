name: Stock Trading Simulation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check input files
        run: |
          ls -lh scripts/simulate_trading.py
          ls -lh data/model_comparison_v3/results.csv
          ls -lh data/stocks/

      - name: Run trading simulation
        run: |
          python scripts/simulate_trading.py

      - name: Display simulation results
        run: |
          python -m json.tool data/trading_simulation/summary.json

      - name: Commit simulation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trading_simulation/
          if ! git diff --cached --quiet; then
            git commit -m "Update stock trading simulation"
            git push
          else
            echo "No changes to commit"
          fi
