name: NVDA Volatility Threshold Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run volatility threshold test
        run: python scripts/test_nvda_volatility_thresholds.py

      - name: Display test results
        run: python -m json.tool data/nvda_volatility_thresholds/summary.json

      - name: Commit test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvda_volatility_thresholds/
          if ! git diff --cached --quiet; then
            git commit -m "Update NVDA volatility threshold test"
            git push
          else
            echo "No changes to commit"
          fi
